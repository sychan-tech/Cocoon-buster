<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>破繭而出 - 單人廣東話版 (Cocoon Buster Single-Player)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
      background: #e8f5e9;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: url('Cocoon buster_counselling.png') center center / cover no-repeat, #e0f2f1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
    }

    /* HUGE BLACK TITLE WITH WHITE GLOW */
    .header-title {
      font-size: 3.8rem;
      font-weight: 900;
      color: #000000;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 30px rgba(255, 255, 255, 0.6);
      letter-spacing: 4px;
      z-index: 10;
      margin-top: 15px;
    }

    .status-bar {
      width: 90%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .status-card {
      background: rgba(255, 255, 255, 0.92);
      padding: 10px 24px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      border: 3px solid #4caf50;
      font-size: 1.4rem;
      font-weight: bold;
      color: #2e7d32;
    }

    .arena {
      display: flex;
      width: 100%;
      height: 70%;
      justify-content: center;
      align-items: center;
      z-index: 5;
    }

    .player-zone {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cocoon-stage {
      position: relative;
      width: 350px;
      height: 450px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Large Butterfly */
    .butterfly-img {
      position: absolute;
      width: 350px;
      height: 350px;
      object-fit: contain;
      z-index: 2;
      opacity: 0;
      transform: scale(0.65);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .butterfly-img.revealed {
      opacity: 1 !important;
      transform: scale(1.35) !important;
      animation: floatWings 2s infinite ease-in-out alternate;
    }

    @keyframes floatWings {
      0% { transform: scale(1.35) translateY(0px) rotate(0deg); }
      50% { transform: scale(1.42) translateY(-12px) rotate(2deg); }
      100% { transform: scale(1.35) translateY(0px) rotate(-2deg); }
    }

    .cocoon-svg {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 3;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.2));
      overflow: visible;
    }

    .cocoon-layer {
      fill: none;
      stroke-linecap: round;
      transform-origin: center;
    }

    /* Complete Layer Detachment Animation */
    .peeled {
      animation: detachAway 0.75s forwards cubic-bezier(0.15, 0.85, 0.35, 1.2);
    }

    @keyframes detachAway {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(1);
        opacity: 1;
      }
      40% {
        opacity: 0.9;
      }
      100% {
        transform: translate(450px, -240px) rotate(80deg) scale(1.3);
        opacity: 0;
      }
    }

    .player-label {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1b5e20;
      background: rgba(255,255,255,0.85);
      padding: 8px 24px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .webcam-preview {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 180px;
      height: 135px;
      border-radius: 12px;
      border: 3px solid #81c784;
      overflow: hidden;
      z-index: 20;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .modal-overlay {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 650px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 4px solid #4caf50;
      border-radius: 24px;
      padding: 18px 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      z-index: 100;
      display: none;
      animation: slideUp 0.5s ease-out forwards;
    }

    @keyframes slideUp {
      from { transform: translate(-50%, 50px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    .modal-title {
      font-size: 2rem;
      color: #2e7d32;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .modal-desc {
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 15px;
    }

    .btn-action {
      background: linear-gradient(135deg, #66bb6a, #43a047);
      color: white;
      font-size: 1.3rem;
      font-weight: bold;
      padding: 12px 32px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(67, 160, 71, 0.4);
      transition: transform 0.2s;
    }

    .btn-action:hover {
      transform: scale(1.05);
    }

    .start-screen {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 150;
      text-align: center;
      padding: 20px;
    }

    .start-screen h1 {
      font-size: 3rem;
      color: #1b5e20;
      margin-bottom: 15px;
    }

    .start-screen p {
      font-size: 1.4rem;
      font-weight: 600;
      color: #388e3c;
      max-width: 650px;
      margin-bottom: 25px;
      line-height: 1.6;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="game-container">
  <div class="header-title">擁抱蛻變 ． 迎向幸福</div>

  <div class="status-bar">
    <div class="status-card" id="layer-status">蠶繭: 18 層</div>
    <div class="status-card" id="timer-display">時間: 0.0 秒</div>
  </div>

  <div class="arena">
    <div class="player-zone">
      <div class="player-label">用力揮動雙手或按空白鍵(Space)</div>
      <div class="cocoon-stage">
        <img class="butterfly-img" id="butterfly" src="Cocoon buster_counselling-2.png" alt="Butterfly" />
        <svg class="cocoon-svg" viewBox="0 0 200 280" id="cocoon-svg"></svg>
      </div>
    </div>
  </div>

  <div class="webcam-preview">
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <div class="start-screen" id="start-screen">
    <h1>破繭而出！ 🦋</h1>
    <p>高難度挑戰！持續強力揮動手臂！<br>剝開蠶繭，看看什麼在裡面！</p>
    <button class="btn-action" id="start-btn">開始遊戲</button>
  </div>

  <div class="modal-overlay" id="victory-modal">
    <div class="modal-title" id="winner-text">👏 歡呼！美麗蛻變！ 🦋</div>
    <div class="modal-desc" id="winner-desc">你成功幫蝴蝶破繭而出！</div>
    <button class="btn-action" onclick="resetGame()">再玩一次</button>
  </div>
</div>

<script>
  // Configuration for High Challenge
  const TOTAL_LAYERS = 18;
  const HITS_PER_LAYER = 2; // Requires 2 strong swipes per layer
  const FORCE_THRESHOLD = 0.22; // High force threshold
  const MOTION_COOLDOWN_FRAMES = 14;

  let currentLayers = TOTAL_LAYERS;
  let currentHits = 0;

  let gameActive = false;
  let startTime = 0;
  let timerInterval = null;

  // Audio System
  let audioCtx = null;
  let bgmInterval = null;

  const griegNotes = [
    69, 73, 76, 81, 76, 73,
    68, 71, 76, 80, 76, 71,
    69, 74, 77, 81, 77, 74,
    71, 73, 76, 81, 76, 73
  ];

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playGriegButterflyBGM() {
    if (bgmInterval) clearInterval(bgmInterval);
    let noteIdx = 0;
    
    bgmInterval = setInterval(() => {
      if (!gameActive || !audioCtx) return;
      
      const midiNote = griegNotes[noteIdx % griegNotes.length];
      const freq = 440 * Math.pow(2, (midiNote - 69) / 12);
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
      
      noteIdx++;
    }, 150);
  }

  function playPeelSFX() {
    if (!audioCtx) return;
    
    const bufferSize = audioCtx.sampleRate * 0.15;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(1400, audioCtx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(4500, audioCtx.currentTime + 0.12);
    filter.Q.value = 3.8;

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    noise.start();
  }

  // Intensive Clapping & Loud Energetic Hooray Cheers
  function playVictoryApplauseAndCheer() {
    if (!audioCtx) return;

    for (let i = 0; i < 250; i++) {
      const delay = Math.random() * 4.0;
      setTimeout(() => {
        if (!audioCtx) return;
        const bufferSize = audioCtx.sampleRate * 0.07;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let j = 0; j < bufferSize; j++) {
          data[j] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 900 + Math.random() * 2800;
        filter.Q.value = 1.6;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.55 + Math.random() * 0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.07);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      }, delay * 1000);
    }

    const fanfare = [
      { f: 523.25, time: 0.0, dur: 0.25 },
      { f: 659.25, time: 0.15, dur: 0.25 },
      { f: 783.99, time: 0.30, dur: 0.25 },
      { f: 1046.50, time: 0.45, dur: 1.1 }
    ];

    fanfare.forEach(note => {
      setTimeout(() => {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(note.f, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.55, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + note.dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + note.dur);
      }, note.time * 1000);
    });

    const cheerSweeps = [
      { start: 300, end: 950, delay: 0.05, dur: 0.85 },
      { start: 400, end: 1150, delay: 0.18, dur: 0.95 },
      { start: 500, end: 1400, delay: 0.30, dur: 1.10 },
      { start: 620, end: 1650, delay: 0.45, dur: 1.25 }
    ];

    cheerSweeps.forEach(s => {
      setTimeout(() => {
        if (!audioCtx) return;
        
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(s.start, audioCtx.currentTime);
        osc1.frequency.exponentialRampToValueAtTime(s.end, audioCtx.currentTime + s.dur);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'square';
        osc2.frequency.setValueAtTime(s.start * 1.01, audioCtx.currentTime);
        osc2.frequency.exponentialRampToValueAtTime(s.end * 1.01, audioCtx.currentTime + s.dur);

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(3200, audioCtx.currentTime);

        gain1.gain.setValueAtTime(0.45, audioCtx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + s.dur);

        gain2.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + s.dur);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(gain1);
        gain1.connect(audioCtx.destination);

        osc1.start();
        osc2.start();
        osc1.stop(audioCtx.currentTime + s.dur);
        osc2.stop(audioCtx.currentTime + s.dur);
      }, s.delay * 1000);
    });
  }

  // Build full 18 layers in PALE YELLOW hue
  function buildCocoonSVG() {
    const svg = document.getElementById('cocoon-svg');
    svg.innerHTML = '';
    
    const rx = 85;
    const cx = 100;
    const cy = 140;

    for (let i = 0; i < TOTAL_LAYERS; i++) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const offset = (i / (TOTAL_LAYERS - 1)) * 190 - 95;
      const yPos = cy + offset * 0.88;
      const widthFactor = Math.cos((offset / 115) * (Math.PI / 2));
      const currentRx = Math.max(20, rx * widthFactor);
      
      const d = `M ${cx - currentRx} ${yPos} 
                 Q ${cx} ${yPos + 26} 
                 ${cx + currentRx} ${yPos}`;
                 
      path.setAttribute('d', d);
      path.setAttribute('class', 'cocoon-layer');
      path.setAttribute('id', `layer-${i}`);
      path.setAttribute('stroke-width', '18');
      
      // PALE YELLOW gradient palette
      path.setAttribute('stroke', `hsl(52, 85%, ${88 - i * 1.5}%)`);
      
      svg.appendChild(path);
    }
  }

  function registerSwipe() {
    if (!gameActive) return;

    currentHits++;
    if (currentHits >= HITS_PER_LAYER) {
      currentHits = 0;
      peelLayer();
    } else {
      playPeelSFX();
    }
  }

  function peelLayer() {
    if (currentLayers > 0) {
      currentLayers--;
      const layerEl = document.getElementById(`layer-${currentLayers}`);
      if (layerEl) layerEl.classList.add('peeled');
      document.getElementById('layer-status').innerText = `蠶繭: ${currentLayers} 層`;
      
      // Dynamic gradual reveal for bigger butterfly
      const progress = (TOTAL_LAYERS - currentLayers) / TOTAL_LAYERS;
      const bfly = document.getElementById('butterfly');
      bfly.style.opacity = Math.min(1, Math.max(0.08, progress)).toFixed(2);
      bfly.style.transform = `scale(${(0.65 + progress * 0.7).toFixed(2)})`;

      playPeelSFX();
      
      if (currentLayers === 0) {
        bfly.classList.add('revealed');
        triggerVictory();
      }
    }
  }

  function triggerVictory() {
    gameActive = false;
    clearInterval(timerInterval);
    if (bgmInterval) clearInterval(bgmInterval);

    playVictoryApplauseAndCheer();

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    
    document.getElementById('winner-desc').innerText = `使用了 ${elapsed} 秒完成了這項極具挑戰性的任務！`;
    document.getElementById('victory-modal').style.display = 'block';
  }

  function resetGame() {
    currentLayers = TOTAL_LAYERS;
    currentHits = 0;
    gameActive = true;
    
    document.getElementById('layer-status').innerText = `蠶繭: ${TOTAL_LAYERS} 層`;
    document.getElementById('timer-display').innerText = `時間: 0.0 秒`;
    
    const bfly = document.getElementById('butterfly');
    
    bfly.classList.remove('revealed');
    bfly.style.opacity = '0';
    bfly.style.transform = 'scale(0.65)';

    document.getElementById('victory-modal').style.display = 'none';

    buildCocoonSVG();

    startTime = Date.now();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (gameActive) {
        const secs = ((Date.now() - startTime) / 1000).toFixed(1);
        document.getElementById('timer-display').innerText = `時間: ${secs} 秒`;
      }
    }, 100);

    playGriegButterflyBGM();
  }

  window.addEventListener('keydown', (e) => {
    if (!gameActive) return;
    if (e.key === 'a' || e.key === 'A' || e.key === 'l' || e.key === 'L' || e.code === 'Space') {
      registerSwipe();
    }
  });

  let prevLeftHand = null;
  let prevRightHand = null;
  let moveCooldown = 0;

  function initCameraTracking() {
    const videoElement = document.getElementById('webcam');
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults((results) => {
      if (!gameActive || !results.poseLandmarks) return;

      const landmarks = results.poseLandmarks;
      const leftWrist = landmarks[15];
      const rightWrist = landmarks[16];

      if (moveCooldown > 0) moveCooldown--;

      let swipeDetected = false;

      // Track left hand forcefully
      if (leftWrist && moveCooldown === 0) {
        if (prevLeftHand) {
          const dist = Math.hypot(leftWrist.x - prevLeftHand.x, leftWrist.y - prevLeftHand.y);
          if (dist > FORCE_THRESHOLD) swipeDetected = true;
        }
        prevLeftHand = { x: leftWrist.x, y: leftWrist.y };
      }

      // Track right hand forcefully
      if (rightWrist && moveCooldown === 0 && !swipeDetected) {
        if (prevRightHand) {
          const dist = Math.hypot(rightWrist.x - prevRightHand.x, rightWrist.y - prevRightHand.y);
          if (dist > FORCE_THRESHOLD) swipeDetected = true;
        }
        prevRightHand = { x: rightWrist.x, y: rightWrist.y };
      }

      if (swipeDetected) {
        registerSwipe();
        moveCooldown = MOTION_COOLDOWN_FRAMES;
      }
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start().catch(() => console.log("Webcam operational fallback enabled"));
  }

  document.getElementById('start-btn').addEventListener('click', () => {
    initAudio();
    document.getElementById('start-screen').style.display = 'none';
    resetGame();
    initCameraTracking();
  });

  buildCocoonSVG();
</script>
</body>
</html>
